<style>

  .readrow .pw-readouts { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 0; }
  .section { padding-block: 36px 8px; display: grid; gap: 18px; }

  .cmp-name small { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); }
  .summary { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl); margin-bottom: 20px; }
  .summary > div { padding: 18px 22px; display: grid; gap: 4px; align-content: start; }
  .summary > div + div { border-left: 1px solid var(--line); }
  .summary .verdict { font-family: var(--font-display); font-stretch: 112%; font-size: 22px; font-weight: 700; line-height: 1.2; }
  .summary .k { font-size: 14px; color: var(--muted); }
  .summary .v { font-family: var(--font-display); font-stretch: 110%; font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .summary p { margin: 0; font-size: 14.5px; color: var(--muted); }
  .cmp-val { text-align: right; font-family: var(--font-display); font-stretch: 106%; font-weight: 650; font-size: 18px; font-variant-numeric: tabular-nums; }
  .good { color: var(--good); } .poor { color: var(--poor); }
  .mission { display: grid; grid-template-columns: 1fr; gap: var(--space-20); }
  .mission > .pw-stack { display: grid; grid-template-columns: 1fr 1.1fr; gap: var(--space-28); align-items: start; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: end; }
  .strip { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; }
  .strip button { height: 40px; border: 0; border-radius: 6px; cursor: pointer; padding: 0; font: 700 14px var(--font-text); color: var(--bg); font-variant-numeric: tabular-nums; }
  .strip button.dark { color: var(--fg); }

  .battery svg { display: block; width: 100%; }
